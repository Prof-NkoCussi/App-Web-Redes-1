<!DOCTYPE html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Redes I — Cuadernillo Digital · Prof. Nicolás A. Cussi</title>
  <meta name="description" content="Cuadernillo digital de Redes I. Colegio Técnico Provincial &quot;Olga B. de Arko&quot;, Ushuaia. Prof. Nicolás A. Cussi.">
  <meta name="theme-color" content="#26C9A1">
  <link rel="preload" href="assets/fonts/barlow-condensed-latin-800-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/estilos.css">
  <style>
    /* Portada principal: solo se usa en esta página */
    .tapa-pagina { background: var(--blanco, #fff); }
    .tapa { background: var(--blanco, #fff); }
    .tapa {
      position: relative; overflow: hidden;
      min-height: 100vh; min-height: 100dvh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: clamp(18px, 3.2vh, 32px);
      padding: 40px 20px 48px; text-align: center;
    }
    .tapa::before {   /* franja de arriba */
      content: ""; position: absolute; left: 0; right: 0; top: 0; height: 10px;
      background: var(--acento, #26C9A1);
    }
    .tapa__red {      /* dibujo de fondo: nodos y enlaces */
      position: absolute; width: min(70vw, 520px); height: auto;
      color: var(--acento-claro, #C9F2E8); fill: currentColor; stroke: currentColor;
      stroke-width: 2.5; stroke-linecap: round; pointer-events: none;
    }
    .tapa__red--a { left: -90px; top: -60px; }
    .tapa__red--b { right: -110px; bottom: -80px; transform: rotate(180deg); }
    .tapa > :not(.tapa__red) { position: relative; }

    .tapa__iconos { display: flex; justify-content: center; gap: clamp(10px, 3vw, 22px); }
    .tapa__iconos li {
      display: flex; align-items: center; justify-content: center;
      width: clamp(62px, 17vw, 104px); aspect-ratio: 1;
      background: var(--acento-suave, #E3F7F2);
      border: 2px solid var(--acento-claro, #C9F2E8); border-radius: 22%;
    }
    .tapa__iconos .ico { width: 62%; height: 62%; stroke-width: 2.4; }

    .tapa__titulo {
      font-family: var(--fuente-titular, "Barlow Condensed", sans-serif); font-weight: 800;
      font-size: clamp(104px, 31vw, 250px); line-height: .82; letter-spacing: -.012em;
      color: var(--tinta, #111827); text-transform: uppercase;
    }
    .tapa__titulo span { color: var(--acento-numero, #069873); }

    .tapa__chip {
      display: inline-block;
      background: var(--acento-numero, #069873); color: var(--blanco, #fff);
      font-family: var(--fuente-titulo, "Barlow Semi Condensed", sans-serif); font-weight: 700;
      font-size: clamp(20px, 5.7vw, 40px); line-height: 1.05;
      padding: .34em .75em .38em; border-radius: 14px;
    }
    .tapa__datos { display: flex; flex-direction: column; gap: 6px; }
    .tapa__escuela {
      font-weight: 700; color: var(--tinta, #111827);
      font-size: clamp(17px, 4.5vw, 27px); line-height: 1.2; text-wrap: balance;
    }
    .tapa__profe { color: var(--gris, #5B6472); font-weight: 700; font-size: clamp(16px, 4vw, 22px); }

    .tapa__entrar {
      display: inline-flex; align-items: center; gap: 10px; margin-top: 6px;
      background: var(--tinta, #111827); color: var(--blanco, #fff);
      font-weight: 700; font-size: clamp(17px, 4.4vw, 21px); text-decoration: none;
      padding: 14px 26px; border-radius: 12px;
    }
    .tapa__entrar:hover { background: #263244; }
    .tapa__entrar svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }

    /* Celular acostado */
    @media (max-width: 859px) and (max-height: 560px) and (orientation: landscape) {
      .tapa { gap: 12px; padding: 26px 20px; }
      .tapa__titulo { font-size: clamp(72px, 26vh, 150px); }
      .tapa__iconos li { width: 54px; }
    }
    /* PC e impresión: hoja A4 vertical, como las láminas */
    @media (min-width: 860px), print {
      .tapa-pagina { background: var(--fondo-pantalla, #DDE3E9); }
      .tapa {
        width: 210mm; height: 297mm; min-height: 0;
        margin: 24px auto 48px; padding: 20mm 16mm;
        gap: 11mm;
        box-shadow: 0 2px 14px rgba(17, 24, 39, .14);
      }
      .tapa::before { height: 5mm; }
      .tapa__red { width: 150mm; }
      .tapa__iconos { gap: 7mm; }
      .tapa__iconos li { width: 30mm; }
      .tapa__titulo { font-size: 66mm; }
      .tapa__chip { font-size: 12mm; }
      .tapa__escuela { font-size: 7.4mm; }
      .tapa__profe { font-size: 6.2mm; }
      .tapa__entrar { font-size: 5.6mm; margin-top: 4mm; }
    }
    @media print {
      .tapa-pagina { background: var(--blanco, #fff); }
      .tapa { margin: 0; box-shadow: none; }
      .tapa__entrar { display: none; }
    }
  </style>
</head>
<body class="tapa-pagina">

<main class="tapa">
  <!-- Fondo decorativo -->

    <path d="M60 70 200 40M200 40l150 70M200 40l-40 130M160 170l190-60M160 170 50 230M160 170l120 110M350 110l110 90M280 280l180-80M60 70 50 230" fill="none"/>
    <circle cx="60" cy="70" r="10"/><circle cx="200" cy="40" r="14"/><circle cx="350" cy="110" r="11"/>

  <svg class="tapa__red tapa__red--b" viewBox="0 0 520 360" aria-hidden="true" focusable="false">

    <circle cx="60" cy="70" r="10"/><circle cx="200" cy="40" r="14"/><circle cx="350" cy="110" r="11"/>
    <circle cx="160" cy="170" r="16"/><circle cx="50" cy="230" r="9"/><circle cx="280" cy="280" r="12"/><circle cx="460" cy="200" r="9"/>
  </svg>

  <!-- Íconos: red, topología, Wi-Fi y router -->
  <ul class="tapa__iconos" aria-hidden="true">
    <li><svg class="ico" viewBox="0 0 48 48" focusable="false">
      <circle cx="24" cy="24" r="19" style="fill:var(--ac)"/>
      <path d="M5 24h38M24 5c-7 5.5-7 32.500 0 38M24 5c7 5.500 7 32.500 0 38M8.500 13.500h31M8.500 34.500h31"/>
    </svg></li>
    <li><svg class="ico" viewBox="0 0 48 48" focusable="false">

      <circle cx="24" cy="24" r="7" style="fill:var(--ac)"/>
      <circle cx="8" cy="8" r="4.500"/><circle cx="40" cy="8" r="4.500"/><circle cx="8" cy="40" r="4.500"/><circle cx="40" cy="40" r="4.500"/>
    </svg></li>
    <li><svg class="ico" viewBox="0 0 48 48" focusable="false">
      <path d="M4 18c11.500-10.500 28.500-10.500 40 0M10.500 25c8-7 19-7 27 0M17 32c4.200-3.600 9.800-3.600 14 0"/>
      <circle cx="24" cy="39" r="3.600" style="fill:var(--ac)"/>

    <li><svg class="ico" viewBox="0 0 48 48" focusable="false">
      <path d="M12 26 8 7M36 26l4-19"/>
      <rect x="4" y="26" width="40" height="14" rx="4" style="fill:var(--ac)"/>
      <path d="M11 33h.500M17 33h.500M23 33h.500M31 33h7M12 40v3M36 40v3"/>
    </svg></li>
  </ul>

  <h1 class="tapa__titulo">Redes <span>I</span></h1>

  <p class="tapa__chip">5° Año • Cuadernillo Digital</p>

  <div class="tapa__datos">
    <p class="tapa__escuela">Colegio Técnico Provincial “Olga B. de Arko” • Ushuaia</p>
    <p class="tapa__profe">Prof. Nicolás A. Cussi</p>
  </div>

  <a class="tapa__entrar" href="indice.html">
    Entrar al cuadernillo
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 12h15M13 6l6 6-6 6"/></svg>
  </a>
</main>

</body>
</html>
